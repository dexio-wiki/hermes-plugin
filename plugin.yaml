name: dexio
version: 0.2.0
description: "Dexio shared wiki as Hermes memory: before each turn, the pages that match the user's message; tools to search, read and write pages other agents and people also use; and a Hermes Desktop pane showing what the agent recalled and wrote, and what your other agents changed."
author: Dexio
kind: exclusive
provides_tools:
  - dexio_search
  - dexio_read
  - dexio_list
  - dexio_write
  - dexio_edit
  - dexio_append
provides_hooks: []
requires_env:
  - DEXIO_API_KEY
